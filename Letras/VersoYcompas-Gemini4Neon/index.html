    let state = {
      view: 'home',
      selectedStyleId: null,

      searchQuery: '',
      lyricSizeRem: 1.125
    };

    function initTheme() {
      const saved = localStorage.getItem('vc_theme');
      const html = document.documentElement;
      if (saved === 'light') {
        html.classList.remove('dark');
      } else {
        html.classList.add('dark');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('vc_theme', html.classList.contains('dark') ? 'dark' : 'light');
    }

    function adjustLyricSize(delta) {
      if (delta === 0) {
        state.lyricSizeRem = 1.125;
      } else {
        state.lyricSizeRem = Math.min(1.6, Math.max(0.9, +(state.lyricSizeRem + delta).toFixed(3)));
      }
      document.documentElement.style.setProperty('--lyric-size', `${state.lyricSizeRem}rem`);
    }

    function navigate(view, id = null) {
      state.view = view;
      if (view === 'style') {
        state.selectedStyleId = id;
        state.selectedSongId = null;
      } else if (view === 'song') {
        state.selectedSongId = id;
        const song = SONGS.find(s => s.id === id);
        if (song) state.selectedStyleId = song.styleId;
      } else {
        state.selectedStyleId = null;
        state.selectedSongId = null;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function handleSearch(query) {
      state.searchQuery = query.trim().toLowerCase();
      render();
    }

    function formatLyrics(rawLyrics, style) {
      return rawLyrics.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '<div class="h-4"></div>';
        if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
          return `<div class="mt-6 mb-2 first:mt-0">
            <span class="section-tag inline-block px-2.5 py-0.5 rounded-md border ${style.badgeClass} font-semibold">
              ${escapeHtml(trimmed)}
            </span>
          </div>`;
        }
        if (trimmed.startsWith('(') && trimmed.endsWith(')')) {
          return `<p class="italic text-slate-500 dark:text-slate-400 text-sm my-1">${escapeHtml(trimmed)}</p>`;
        }
        return `<p class="text-slate-800 dark:text-slate-200">${escapeHtml(trimmed)}</p>`;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
    }

    async function copyLyrics(songId) {
      const song = SONGS.find(s => s.id === songId);
      if (!song) return;
      const text = `${song.title} — ${song.artist}\n\n${song.lyrics}`;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('copy-btn-label');
        if (btn) {
          const prev = btn.textContent;
          btn.textContent = '¡Letra copiada!';
          setTimeout(() => { btn.textContent = prev; }, 2000);
        }
      } catch (e) {
        alert('No se pudo acceder al portapapeles.');
      }
    }

    function renderTopNav() {
      const nav = document.getElementById('top-nav-styles');
      if (!nav) return;
      nav.innerHTML = STYLES.map(style => {
        const active = state.selectedStyleId === style.id && state.view !== 'home';
        return `
          <button
            onclick="navigate('style', '${style.id}')"
            class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
              active
                ? `${style.accentBg} ${style.accentText} font-semibold`
                : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slatecard'
            }"
          >
            ${style.name}
          </button>
        `;
      }).join('');
    }

    function renderSearchResults() {
      const q = state.searchQuery;
      const matches = SONGS.filter(song => {
        const style = STYLES.find(st => st.id === song.styleId);
        return (
          song.title.toLowerCase().includes(q) ||
          song.artist.toLowerCase().includes(q) ||
          song.lyrics.toLowerCase().includes(q) ||
          song.key.toLowerCase().includes(q) ||
          song.timeSignature.toLowerCase().includes(q) ||
          String(song.bpm).includes(q) ||
          (style && style.name.toLowerCase().includes(q))
        );
      });

      return `
        <section>
          <div class="flex items-center justify-between mb-6">
            <div>
              <p class="text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400">Búsqueda en tiempo real</p>
              <h1 class="text-2xl sm:text-3xl font-extrabold mt-1">Resultados para «${escapeHtml(state.searchQuery)}» (${matches.length})</h1>
            </div>
            <button onclick="document.getElementById('global-search').value=''; handleSearch('');" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
              Limpiar filtro
            </button>
          </div>

          ${matches.length === 0 ? `
            <div class="rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard p-10 text-center">
              <p class="text-slate-600 dark:text-slate-400">No se encontraron canciones que coincidan con tu búsqueda.</p>
            </div>
          ` : `
            <div class="grid gap-4 sm:grid-cols-2">
              ${matches.map(song => {
                const style = STYLES.find(st => st.id === song.styleId);
                return renderSongCard(song, style);
              }).join('')}
            </div>
          `}
        </section>
      `;
    }

    function renderSongCard(song, style) {
      return `
        <article
          onclick="navigate('song', '${song.id}')"
          class="group cursor-pointer rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard p-6 hover:border-slate-400 dark:hover:border-slate-600 transition-all shadow-sm hover:shadow-md flex flex-col justify-between"
        >
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-mono px-2.5 py-0.5 rounded-full border ${style.badgeClass}">
                ${style.name}
              </span>
              <span class="text-xs font-mono text-slate-500 dark:text-slate-400">
                ${song.bpm} BPM · ${song.timeSignature}
              </span>
            </div>
            <h3 class="text-xl font-bold group-hover:underline decoration-2 underline-offset-4">
              ${song.title}
            </h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${song.artist}</p>
            <p class="text-sm text-slate-600 dark:text-slate-300 mt-3 line-clamp-2 italic">
              «${song.lyrics.split('\n').find(l => l.trim() && !l.trim().startsWith('[') && !l.trim().startsWith('(')) || ''}»
            </p>
          </div>

          <div class="mt-5 pt-4 border-t border-paperborder dark:border-slateborder flex items-center justify-between text-xs font-mono text-slate-500 dark:text-slate-400">
            <span>${song.key}</span>
            <span class="${style.accentText} font-semibold group-hover:translate-x-0.5 transition-transform">Leer letra →</span>
          </div>
        </article>
      `;
    }

    function renderHome() {
      return `
        <section class="mb-12">
          <div class="max-w-3xl">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 border border-indigo-500/20 mb-4">
              ANTOLOGÍA MUSICAL INTERACTIVA
            </span>
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
              Donde la palabra encuentra su <span class="bg-gradient-to-r from-indigo-500 via-cyan-500 to-emerald-500 bg-clip-text text-transparent">arquitectura sonora</span>.
            </h1>
            <p class="mt-4 text-base sm:text-lg text-slate-600 dark:text-slate-300 leading-relaxed">
              Explora tres universos musicales a través de sus letras completas, métricas, tonalidades e instrumentación detallada. Selecciona un estilo para sumergirte en su repertorio.
            </p>
          </div>
        </section>

        <!-- Styles Grid -->
        <section class="mb-14">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold tracking-tight">Estilos musicales</h2>
            <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${STYLES.length} géneros catalogados</span>
          </div>

          <div class="grid gap-6 md:grid-cols-3">
            ${STYLES.map(style => {
              const count = SONGS.filter(s => s.styleId === style.id).length;
              return `
                <article
                  onclick="navigate('style', '${style.id}')"
                  class="group cursor-pointer rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard overflow-hidden hover:border-slate-400 dark:hover:border-slate-600 transition-all shadow-sm hover:shadow-lg flex flex-col justify-between"
                >
                  <div>
                    <div class="h-2 w-full bg-gradient-to-r ${style.gradient}"></div>
                    <div class="p-6">
                      <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-mono px-2.5 py-0.5 rounded-full border ${style.badgeClass}">
                          ${count} canciones
                        </span>
                        <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${style.tempoRange}</span>
                      </div>
                      <h3 class="text-2xl font-extrabold tracking-tight group-hover:underline decoration-2 underline-offset-4">
                        ${style.name}
                      </h3>
                      <p class="text-sm font-medium ${style.accentText} mt-1">${style.tagline}</p>
                      <p class="text-sm text-slate-600 dark:text-slate-300 mt-3 leading-relaxed">
                        ${style.description}
                      </p>
                    </div>
                  </div>

                  <div class="px-6 py-4 bg-slate-50/70 dark:bg-slatebg/50 border-t border-paperborder dark:border-slateborder flex items-center justify-between text-xs font-mono">
                    <span class="text-slate-500 dark:text-slate-400">Compás: ${style.timeSignatures.split(' ')[0]}</span>
                    <span class="${style.accentText} font-semibold group-hover:translate-x-1 transition-transform">Explorar estilo →</span>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Featured Songs -->
        <section>
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold tracking-tight">Repertorio completo</h2>
            <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${SONGS.length} letras disponibles</span>
          </div>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            ${SONGS.map(song => {
              const style = STYLES.find(st => st.id === song.styleId);
              return renderSongCard(song, style);
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderStyleView() {
      const style = STYLES.find(s => s.id === state.selectedStyleId);
      if (!style) return renderHome();
      const styleSongs = SONGS.filter(s => s.styleId === style.id);

      return `
        <div>
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-xs font-mono text-slate-500 dark:text-slate-400 mb-6">
            <button onclick="navigate('home')" class="hover:text-slate-900 dark:hover:text-white transition-colors">Inicio</button>
            <span>/</span>
            <span class="${style.accentText} font-semibold">${style.name}</span>
          </nav>

          <!-- Style Header Card -->
          <section class="rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard overflow-hidden mb-10 shadow-sm">
            <div class="h-2.5 w-full bg-gradient-to-r ${style.gradient}"></div>
            <div class="p-6 sm:p-8">
              <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <span class="text-xs font-mono px-3 py-1 rounded-full border ${style.badgeClass}">
                  FICHA DE ESTILO MUSICAL
                </span>
                <span class="text-xs font-mono text-slate-500 dark:text-slate-400">Paleta: ${style.secondaryLabel}</span>
              </div>

              <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">${style.name}</h1>
              <p class="text-base sm:text-lg font-medium ${style.accentText} mt-1">${style.tagline}</p>
              <p class="text-slate-600 dark:text-slate-300 mt-4 max-w-3xl leading-relaxed">
                ${style.description}
              </p>

              <!-- Technical Grid -->
              <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-8 pt-6 border-t border-paperborder dark:border-slateborder">
                <div>
                  <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 block">Tempo habitual</span>
                  <span class="text-sm font-mono font-semibold mt-1 block">${style.tempoRange}</span>
                </div>
                <div>
                  <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 block">Métrica y compás</span>
                  <span class="text-sm font-mono font-semibold mt-1 block">${style.timeSignatures}</span>
                </div>
                <div>
                  <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 block">Perfil armónico</span>
                  <span class="text-sm font-medium mt-1 block">${style.harmonyProfile}</span>
                </div>
                <div>
                  <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 block">Instrumentación clave</span>
                  <span class="text-sm font-medium mt-1 block">${style.instrumentation}</span>
                </div>
              </div>
            </div>
          </section>

          <!-- Songs in Style -->
          <section>
            <h2 class="text-xl font-bold tracking-tight mb-5">Canciones de ${style.name} (${styleSongs.length})</h2>
            <div class="grid gap-5 sm:grid-cols-2">
              ${styleSongs.map(song => renderSongCard(song, style)).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderSongView() {
      const song = SONGS.find(s => s.id === state.selectedSongId);
      if (!song) return renderHome();
      const style = STYLES.find(st => st.id === song.styleId);
      const styleSongs = SONGS.filter(s => s.styleId === style.id);
      const currentIdx = styleSongs.findIndex(s => s.id === song.id);
      const prevSong = styleSongs[(currentIdx - 1 + styleSongs.length) % styleSongs.length];
      const nextSong = styleSongs[(currentIdx + 1) % styleSongs.length];

      return `
        <div>
          <!-- Breadcrumb -->
          <nav class="flex flex-wrap items-center gap-2 text-xs font-mono text-slate-500 dark:text-slate-400 mb-6">
            <button onclick="navigate('home')" class="hover:text-slate-900 dark:hover:text-white transition-colors">Inicio</button>
            <span>/</span>
            <button onclick="navigate('style', '${style.id}')" class="hover:text-slate-900 dark:hover:text-white transition-colors">${style.name}</button>
            <span>/</span>
            <span class="${style.accentText} font-semibold">${song.title}</span>
          </nav>

          <div class="grid lg:grid-cols-12 gap-8 items-start">
            <!-- Lyrics Column -->
            <div class="lg:col-span-8 rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard p-6 sm:p-10 shadow-sm">
              <div class="flex flex-wrap items-start justify-between gap-4 pb-6 border-b border-paperborder dark:border-slateborder">
                <div>
                  <span class="text-xs font-mono px-2.5 py-0.5 rounded-full border ${style.badgeClass}">
                    ${style.name}
                  </span>
                  <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight mt-3">${song.title}</h1>
                  <p class="text-base text-slate-500 dark:text-slate-400 font-medium mt-1">${song.artist}</p>
                </div>

                <!-- Reader Controls -->
                <div class="flex items-center gap-2">
                  <div class="inline-flex items-center rounded-xl border border-paperborder dark:border-slateborder bg-slate-50 dark:bg-slatebg p-1 text-xs font-mono">
                    <button onclick="adjustLyricSize(-0.1)" class="px-2.5 py-1 hover:bg-white dark:hover:bg-slatecard rounded-lg" title="Reducir letra">A-</button>
                    <button onclick="adjustLyricSize(0)" class="px-2 py-1 hover:bg-white dark:hover:bg-slatecard rounded-lg text-slate-400" title="Tamaño original">100%</button>
                    <button onclick="adjustLyricSize(0.1)" class="px-2.5 py-1 hover:bg-white dark:hover:bg-slatecard rounded-lg" title="Aumentar letra">A+</button>
                  </div>

                  <button
                    onclick="copyLyrics('${song.id}')"
                    class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-paperborder dark:border-slateborder bg-slate-50 dark:bg-slatebg hover:border-slate-400 dark:hover:border-slate-500 text-xs font-semibold transition-colors"
                  >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <span id="copy-btn-label">Copiar letra</span>
                  </button>
                </div>
              </div>

              <!-- Formatted Lyrics -->
              <div class="lyric-body mt-8">
                ${formatLyrics(song.lyrics, style)}
              </div>

              <!-- Prev / Next Navigation -->
              <div class="mt-10 pt-6 border-t border-paperborder dark:border-slateborder flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <button
                  onclick="navigate('song', '${prevSong.id}')"
                  class="text-left px-4 py-3 rounded-xl border border-paperborder dark:border-slateborder hover:bg-slate-50 dark:hover:bg-slatebg transition-colors"
                >
                  <span class="text-[11px] font-mono text-slate-400 block">← Anterior en ${style.name}</span>
                  <span class="text-sm font-bold">${prevSong.title}</span>
                </button>
                <button
                  onclick="navigate('song', '${nextSong.id}')"
                  class="text-right px-4 py-3 rounded-xl border border-paperborder dark:border-slateborder hover:bg-slate-50 dark:hover:bg-slatebg transition-colors"
                >
                  <span class="text-[11px] font-mono text-slate-400 block">Siguiente en ${style.name} →</span>
                  <span class="text-sm font-bold">${nextSong.title}</span>
                </button>
              </div>
            </div>

            <!-- Technical Specs Sidebar -->
            <aside class="lg:col-span-4 lg:sticky lg:top-24 rounded-2xl border border-paperborder dark:border-slateborder bg-white dark:bg-slatecard p-6 shadow-sm">
              <h2 class="text-xs font-mono uppercase tracking-wider text-slate-400 mb-4">Ficha técnica de la obra</h2>

              <dl class="space-y-4 text-sm">
                <div class="flex justify-between gap-4 pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400">Proyecto</dt>
                  <dd class="font-semibold text-right">${song.artist}</dd>
                </div>
                <div class="flex justify-between gap-4 pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400">Tonalidad</dt>
                  <dd class="font-mono font-semibold text-right">${song.key}</dd>
                </div>
                <div class="flex justify-between gap-4 pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400">Compás</dt>
                  <dd class="font-mono font-semibold text-right">${song.timeSignature}</dd>
                </div>
                <div class="flex justify-between gap-4 pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400">Tempo</dt>
                  <dd class="font-mono font-semibold text-right">${song.bpm} BPM</dd>
                </div>
                <div class="flex justify-between gap-4 pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400">Duración</dt>
                  <dd class="font-mono font-semibold text-right">${song.duration}</dd>
                </div>
                <div class="pb-3 border-b border-paperborder dark:border-slateborder">
                  <dt class="text-slate-500 dark:text-slate-400 mb-1">Instrumentación</dt>
                  <dd class="font-medium leading-relaxed">${song.instruments}</dd>
                </div>
                <div>
                  <dt class="text-slate-500 dark:text-slate-400 mb-1">Notas de producción</dt>
                  <dd class="text-slate-600 dark:text-slate-300 leading-relaxed">${song.production}</dd>
                </div>
              </dl>

              <button
                onclick="navigate('style', '${style.id}')"
                class="mt-6 w-full py-2.5 px-4 rounded-xl border ${style.accentBorder} ${style.accentBg} ${style.accentText} text-xs font-mono font-semibold hover:opacity-90 transition-opacity"
              >
                Ver todas las obras de ${style.name}
              </button>
            </aside>
          </div>
        </div>
      `;
    }

    function render() {
      renderTopNav();
      const app = document.getElementById('app');
      if (!app) return;

      if (state.searchQuery) {
        app.innerHTML = renderSearchResults();
        return;
      }

      if (state.view === 'style') {
        app.innerHTML = renderStyleView();
      } else if (state.view === 'song') {
        app.innerHTML = renderSongView();
      } else {
        app.innerHTML = renderHome();
      }
    }

    initTheme();
    render();
  </script>
</body>
</html>
