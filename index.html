<!DOCTYPE html>
<html lang="es" class="h-full w-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Mágico y Colorido</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Righteous y Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Righteous&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050510;
        }

        .font-righteous {
            font-family: 'Righteous', cursive;
        }

        /* Estilo para las letras del Hello World */
        .magical-letter {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease, color 0.3s ease;
            transform-origin: center bottom;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            will-change: transform, filter;
        }

        .magical-letter:hover {
            transform: translateY(-25px) scale(1.25) rotate(calc(var(--rand-rot, 1) * 8deg));
            filter: drop-shadow(0 0 35px var(--glow-color, #ff00ff));
        }

        .magical-letter.active-bump {
            animation: bump 0.5s ease-out forwards;
        }

        @keyframes bump {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-40px) scale(1.4) rotate(-5deg); }
            70% { transform: translateY(10px) scale(0.9); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Efecto Neón Flotante para el subtexto */
        .glowing-subtitle {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(147, 51, 234, 0.5);
        }

        /* Estilo Glassmorphism para el Panel */
        .glass-panel {
            background: rgba(15, 15, 35, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-button:active {
            transform: translateY(1px);
        }

        /* Modo Fiesta Caleidoscopio */
        .party-rainbow {
            animation: hueRotate 3s linear infinite;
        }

        @keyframes hueRotate {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }

        /* Ocultar barra de desplazamiento */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full w-full relative overflow-hidden flex flex-col justify-between items-center text-white">

    <!-- Canvas de Fondo Mágico (Nebulosas, Aurora, Estrellas y Partículas) -->
    <canvas id="bg-canvas" class="absolute inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <!-- Header / Subtítulo Superior -->
    <header class="relative z-10 pt-8 md:pt-12 text-center px-4">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-panel text-xs md:text-sm font-semibold tracking-wider text-cyan-300 uppercase animate-pulse mb-3">
            <i class="fa-solid fa-wand-magic-sparkles text-yellow-300"></i> Experiencia Interactiva
        </div>
        <p class="glowing-subtitle text-slate-300 text-sm md:text-lg max-w-md mx-auto font-light">
            Pasa el cursor sobre las letras o haz clic en cualquier lugar para desatar la magia
        </p>
    </header>

    <!-- Contenedor Principal: HELLO WORLD -->
    <main class="relative z-10 flex flex-col items-center justify-center my-auto px-4 text-center">
        <!-- Contenedor de Texto -->
        <div id="hello-world-container" class="font-righteous text-6xl sm:text-7xl md:text-8xl lg:text-9xl tracking-wider flex flex-wrap justify-center gap-x-6 sm:gap-x-10 gap-y-2 my-6">
            <!-- Las letras se renderizan dinámicamente con JavaScript -->
        </div>

        <!-- Mensaje de Estado / Modo -->
        <div id="status-badge" class="mt-4 text-xs md:text-sm font-medium px-4 py-1.5 rounded-full glass-panel text-fuchsia-300 opacity-90 transition-all duration-300 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            Tema Actual: <span id="current-theme-name" class="font-bold text-white">Aurora Mística</span>
        </div>
    </main>

    <!-- Panel de Control Flotante -->
    <footer class="relative z-20 pb-6 px-4 w-full max-w-4xl">
        <div class="glass-panel rounded-2xl md:rounded-full p-3 md:p-4 flex flex-wrap items-center justify-between gap-3 shadow-2xl">
            
            <!-- Selector de Temas -->
            <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto justify-center pb-1 md:pb-0">
                <span class="text-xs uppercase font-bold text-slate-400 mr-1 hidden sm:inline"><i class="fa-solid fa-palette mr-1"></i> Temas:</span>
                <button onclick="setTheme('aurora')" class="glass-button text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5 text-cyan-300 hover:text-white">
                    <span class="w-2.5 h-2.5 rounded-full bg-teal-400"></span> Aurora
                </button>
                <button onclick="setTheme('neon')" class="glass-button text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5 text-fuchsia-300 hover:text-white">
                    <span class="w-2.5 h-2.5 rounded-full bg-fuchsia-500"></span> Galaxia
                </button>
                <button onclick="setTheme('forest')" class="glass-button text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5 text-emerald-300 hover:text-white">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Bosque
                </button>
                <button onclick="setTheme('sunset')" class="glass-button text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5 text-amber-300 hover:text-white">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-400"></span> Atardecer
                </button>
            </div>

            <!-- Acciones Mágicas y Controles -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-center">
                <!-- Botón Lluvia de Estrellas -->
                <button onclick="triggerMeteorShower()" class="glass-button text-xs md:text-sm px-3.5 py-1.5 rounded-full font-semibold text-yellow-300 hover:text-yellow-100 flex items-center gap-2">
                    <i class="fa-solid fa-meteor text-yellow-400"></i> <span class="hidden sm:inline">Lluvia de</span> Estrellas
                </button>

                <!-- Botón Modo Fiesta -->
                <button id="btn-party" onclick="togglePartyMode()" class="glass-button text-xs md:text-sm px-3.5 py-1.5 rounded-full font-semibold text-pink-300 hover:text-pink-100 flex items-center gap-2">
                    <i class="fa-solid fa-compact-disc text-pink-400"></i> Modo Fiesta
                </button>

                <!-- Audio Toggle -->
                <button id="btn-audio" onclick="toggleAudio()" class="glass-button text-xs p-2 rounded-full w-8 h-8 flex items-center justify-center text-slate-300 hover:text-white" title="Activar/Desactivar Sonido Mágico">
                    <i class="fa-solid fa-volume-xmark" id="audio-icon"></i>
                </button>
            </div>

        </div>
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        /* ==========================================================================
           1. CONFIGURACIÓN Y ESTADO GLOBAL
           ========================================================================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const helloContainer = document.getElementById('hello-world-container');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Audio Context (Sintetizador Web Audio API)
        let audioCtx = null;
        let soundEnabled = false;

        // Estado del Sistema
        let partyMode = false;
        let currentThemeKey = 'aurora';
        let mouse = { x: width / 2, y: height / 2, active: false };

        // Definición de Temas de Color Mágicos
        const themes = {
            aurora: {
                name: "Aurora Mística",
                bgGradient: ['#030914', '#081b29', '#0d0d2b'],
                auroraColors: ['rgba(0, 255, 204, 0.15)', 'rgba(0, 153, 255, 0.15)', 'rgba(153, 51, 255, 0.12)'],
                textGlows: ['#00ffcc', '#0099ff', '#3366ff', '#9933ff', '#ff00ff', '#00ffff'],
                letterColors: ['#a7f3d0', '#67e8f9', '#7dd3fc', '#c084fc', '#f472b6', '#38bdf8', '#818cf8', '#e879f9', '#34d399', '#a5b4fc'],
                particlePalette: ['#00ffcc', '#0099ff', '#a7f3d0', '#f472b6', '#ffffff']
            },
            neon: {
                name: "Galaxia Neón",
                bgGradient: ['#0d021a', '#1a052e', '#050014'],
                auroraColors: ['rgba(255, 0, 128, 0.18)', 'rgba(0, 230, 255, 0.18)', 'rgba(180, 0, 255, 0.15)'],
                textGlows: ['#ff007f', '#00f0ff', '#ff00ff', '#7928ca', '#00dfd8'],
                letterColors: ['#f472b6', '#38bdf8', '#fb7185', '#c084fc', '#22d3ee', '#e879f9', '#f43f5e', '#a855f7', '#38bdf8', '#fb923c'],
                particlePalette: ['#ff007f', '#00f0ff', '#ff00ff', '#ffff00', '#ffffff']
            },
            forest: {
                name: "Bosque Encantado",
                bgGradient: ['#02140d', '#05291b', '#010d18'],
                auroraColors: ['rgba(52, 211, 153, 0.18)', 'rgba(251, 191, 36, 0.15)', 'rgba(16, 185, 129, 0.12)'],
                textGlows: ['#34d399', '#fbbf24', '#a3e635', '#10b981', '#f59e0b'],
                letterColors: ['#6ee7b7', '#fde047', '#bef264', '#86efac', '#fcd34d', '#4ade80', '#a3e635', '#fef08a', '#34d399', '#f59e0b'],
                particlePalette: ['#34d399', '#fbbf24', '#a3e635', '#ffffff', '#f59e0b']
            },
            sunset: {
                name: "Atardecer Cósmico",
                bgGradient: ['#1a0514', '#2d0b22', '#0f051d'],
                auroraColors: ['rgba(255, 99, 71, 0.18)', 'rgba(255, 0, 128, 0.15)', 'rgba(255, 165, 0, 0.15)'],
                textGlows: ['#ff6347', '#ff007f', '#ffa500', '#ff1493', '#ff4500'],
                letterColors: ['#fda4af', '#fcd34d', '#f87171', '#fb923c', '#f472b6', '#fbbf24', '#ff8c00', '#e11d48', '#f43f5e', '#fdba74'],
                particlePalette: ['#ff6347', '#ffa500', '#ff007f', '#ffe4e1', '#ffffff']
            }
        };

        let currentTheme = themes[currentThemeKey];

        /* ==========================================================================
           2. SINTETIZADOR DE AUDIO MÁGICO (Web Audio API)
           ========================================================================== */
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-audio');
            const icon = document.getElementById('audio-icon');

            if (soundEnabled) {
                initAudio();
                btn.classList.add('bg-purple-600/40', 'border-purple-400', 'text-yellow-300');
                icon.className = 'fa-solid fa-volume-high';
                playChime(523.25, 'sine', 0.15); // C5 Chime
            } else {
                btn.classList.remove('bg-purple-600/40', 'border-purple-400', 'text-yellow-300');
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        // Toca un timbre armónico suave
        function playChime(freq, type = 'sine', duration = 0.3) {
            if (!soundEnabled || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Envolvente de sonido suave
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error(e);
            }
        }

        // Escalas armónicas pentatónicas mágicas para interactividad
        const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
        function playRandomMagicNote() {
            const freq = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
            playChime(freq, 'sine', 0.4);
        }

        /* ==========================================================================
           3. INICIALIZACIÓN DE TEXTO INTERACTIVO "HELLO WORLD"
           ========================================================================== */
        const textWords = ["HELLO", "WORLD"];
        
        function renderHelloWorld() {
            helloContainer.innerHTML = '';
            let letterIndex = 0;

            textWords.forEach((word, wordIdx) => {
                const wordSpan = document.createElement('div');
                wordSpan.className = 'flex inline-block';

                for (let i = 0; i < word.length; i++) {
                    const char = word[i];
                    const letterSpan = document.createElement('span');
                    letterSpan.className = 'magical-letter';
                    letterSpan.textContent = char;
                    
                    // Asignar color de tema inicial
                    const color = currentTheme.letterColors[letterIndex % currentTheme.letterColors.length];
                    const glow = currentTheme.textGlows[letterIndex % currentTheme.textGlows.length];
                    
                    letterSpan.style.color = color;
                    letterSpan.style.setProperty('--glow-color', glow);
                    letterSpan.style.setProperty('--rand-rot', (Math.random() - 0.5).toString());
                    
                    const charFreq = pentatonicScale[letterIndex % pentatonicScale.length];

                    // Eventos Interactivos
                    letterSpan.addEventListener('mouseenter', (e) => {
                        triggerLetterHover(letterSpan, charFreq, e);
                    });

                    letterSpan.addEventListener('click', (e) => {
                        triggerLetterClick(letterSpan, charFreq, e);
                    });

                    // Eventos Táctiles
                    letterSpan.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        triggerLetterClick(letterSpan, charFreq, { clientX: touch.clientX, clientY: touch.clientY });
                    });

                    wordSpan.appendChild(letterSpan);
                    letterIndex++;
                }

                helloContainer.appendChild(wordSpan);
            });
        }

        function triggerLetterHover(element, freq, event) {
            playChime(freq, 'sine', 0.25);
            
            // Generar destello de color aleatorio
            const randomGlow = currentTheme.textGlows[Math.floor(Math.random() * currentTheme.textGlows.length)];
            element.style.setProperty('--glow-color', randomGlow);

            // Generar pequeñas chispas mágicas sobre la letra
            const rect = element.getBoundingClientRect();
            const posX = rect.left + rect.width / 2;
            const posY = rect.top + rect.height / 2;
            
            createSparks(posX, posY, 6, currentTheme.particlePalette);
        }

        function triggerLetterClick(element, freq, event) {
            playChime(freq * 1.5, 'triangle', 0.5);
            playChime(freq * 0.75, 'sine', 0.6);

            // Animación de Salto
            element.classList.remove('active-bump');
            void element.offsetWidth; // Trigger Reflow
            element.classList.add('active-bump');

            // Explosión de Fuegos Artificiales en la letra
            const clientX = event.clientX || (event.touches && event.touches[0].clientX) || window.innerWidth/2;
            const clientY = event.clientY || (event.touches && event.touches[0].clientY) || window.innerHeight/2;

            createFireworks(clientX, clientY, 40);
            createShockwave(clientX, clientY);
        }

        /* ==========================================================================
           4. SISTEMA DE CANVAS 2D: AURORA, ESTRELLAS, NEBULOSAS Y PARTÍCULAS
           ========================================================================== */
        
        // --- Estrellas ---
        const stars = [];
        const numStars = 180;

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.02 + 0.005;
                this.color = ['#ffffff', '#e0f2fe', '#fef08a', '#fbcfe8'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0.1) {
                    this.speed = -this.speed;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.abs(this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.size * 3;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Meteoros (Lluvia de Estrellas) ---
        const meteors = [];

        class Meteor {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width * 1.3 - width * 0.1;
                this.y = -50;
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 12 + 8;
                this.angle = Math.PI / 4; // 45 grados
                this.alpha = 1;
                this.thickness = Math.random() * 2 + 1;
                this.color = currentTheme.particlePalette[Math.floor(Math.random() * currentTheme.particlePalette.length)];
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.alpha -= 0.012;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                const endX = this.x - Math.cos(this.angle) * this.length;
                const endY = this.y - Math.sin(this.angle) * this.length;

                const grad = ctx.createLinearGradient(this.x, this.y, endX, endY);
                grad.addColorStop(0, this.color);
                grad.addColorStop(1, 'transparent');

                ctx.strokeStyle = grad;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- Nebulosas Flotantes ---
        const nebulas = [
            { x: width * 0.2, y: height * 0.3, radius: 250, vx: 0.2, vy: 0.1 },
            { x: width * 0.8, y: height * 0.7, radius: 300, vx: -0.15, vy: -0.2 },
            { x: width * 0.5, y: height * 0.5, radius: 200, vx: 0.1, vy: -0.1 }
        ];

        function drawNebulas() {
            nebulas.forEach((n, idx) => {
                n.x += n.vx;
                n.y += n.vy;

                if (n.x < 0 || n.x > width) n.vx *= -1;
                if (n.y < 0 || n.y > height) n.vy *= -1;

                const color = currentTheme.auroraColors[idx % currentTheme.auroraColors.length];
                const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.radius);
                grad.addColorStop(0, color);
                grad.addColorStop(1, 'transparent');

                ctx.save();
                ctx.fillStyle = grad;
                ctx.globalCompositeOperation = 'screen';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // --- Aurora Boreal Sinusoidal ---
        let auroraTime = 0;
        function drawAurora() {
            auroraTime += 0.008;
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                const colors = currentTheme.auroraColors;
                const grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, colors[i % colors.length]);
                grad.addColorStop(0.5, colors[(i + 1) % colors.length]);
                grad.addColorStop(1, 'transparent');

                ctx.fillStyle = grad;
                ctx.moveTo(0, height);

                for (let x = 0; x <= width; x += 20) {
                    const y = Math.sin(x * 0.003 + auroraTime + i) * 70 +
                              Math.cos(x * 0.001 + auroraTime * 0.5) * 40 +
                              (height * 0.35 + i * 60);
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        // --- Sistema de Partículas (Polvo de Hadas, Fuegos Artificiales y Ondas) ---
        const particles = [];
        const shockwaves = [];

        class Particle {
            constructor(x, y, color, speedMultiplier = 1, isSpark = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 4 + 1) * speedMultiplier;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 3 + 1.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.gravity = isSpark ? 0.05 : 0;
                this.friction = 0.97;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.size * 4;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = Math.random() * 80 + 70;
                this.alpha = 1;
                this.color = currentTheme.textGlows[Math.floor(Math.random() * currentTheme.textGlows.length)];
                this.speed = 4;
            }

            update() {
                this.radius += this.speed;
                this.alpha = 1 - (this.radius / this.maxRadius);
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Generadores de partículas
        function createSparks(x, y, count = 5, palette = currentTheme.particlePalette) {
            for (let i = 0; i < count; i++) {
                const color = palette[Math.floor(Math.random() * palette.length)];
                particles.push(new Particle(x, y, color, 0.6, false));
            }
        }

        function createFireworks(x, y, count = 35) {
            for (let i = 0; i < count; i++) {
                const color = currentTheme.particlePalette[Math.floor(Math.random() * currentTheme.particlePalette.length)];
                particles.push(new Particle(x, y, color, 1.8, true));
            }
        }

        function createShockwave(x, y) {
            shockwaves.push(new Shockwave(x, y));
        }

        function triggerMeteorShower() {
            playChime(880, 'sine', 0.8);
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    meteors.push(new Meteor());
                }, i * 120);
            }
        }

        /* ==========================================================================
           5. EVENTOS INTERACTIVOS GLOBALES
           ========================================================================== */
        // Movimiento del Ratón (Polvo de Hadas)
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
            createSparks(mouse.x, mouse.y, 2);
        });

        // Soporte Táctil para Dispositivos Móviles
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            createSparks(mouse.x, mouse.y, 2);
        });

        // Clic en la pantalla (Explosión + Sonido)
        window.addEventListener('click', (e) => {
            // Evitar clic si se presionó sobre la barra de controles
            if (e.target.closest('footer')) return;

            initAudio();
            playRandomMagicNote();
            createFireworks(e.clientX, e.clientY, 40);
            createShockwave(e.clientX, e.clientY);
        });

        // Redimensionamiento de Pantalla
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars.length = 0;
            initStars();
        });

        function initStars() {
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        /* ==========================================================================
           6. CAMBIO DE TEMAS Y MODO FIESTA
           ========================================================================== */
        function setTheme(themeKey) {
            if (!themes[themeKey]) return;
            currentThemeKey = themeKey;
            currentTheme = themes[themeKey];

            document.getElementById('current-theme-name').textContent = currentTheme.name;
            playChime(659.25, 'sine', 0.3);

            // Actualizar letras
            renderHelloWorld();
            
            // Explosión de cambio de tema en el centro
            createFireworks(width / 2, height / 2, 60);
            createShockwave(width / 2, height / 2);
        }

        function togglePartyMode() {
            partyMode = !partyMode;
            const btn = document.getElementById('btn-party');
            
            if (partyMode) {
                document.body.classList.add('party-rainbow');
                btn.classList.add('bg-pink-600/50', 'border-pink-300', 'text-white');
                triggerMeteorShower();
                playChime(880, 'triangle', 0.5);
            } else {
                document.body.classList.remove('party-rainbow');
                btn.classList.remove('bg-pink-600/50', 'border-pink-300', 'text-white');
            }
        }

        /* ==========================================================================
           7. BUCLE PRINCIPAL DE ANIMACIÓN (60 FPS)
           ========================================================================== */
        function drawBackgroundGradient() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, currentTheme.bgGradient[0]);
            grad.addColorStop(0.5, currentTheme.bgGradient[1]);
            grad.addColorStop(1, currentTheme.bgGradient[2]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Limpiar y Dibujar Fondo
            drawBackgroundGradient();

            // Dibujar Componentes del Cielo Mágico
            drawNebulas();
            drawAurora();

            // Renderizar Estrellas
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Renderizar Meteoros
            for (let i = meteors.length - 1; i >= 0; i--) {
                meteors[i].update();
                meteors[i].draw();
                if (meteors[i].alpha <= 0) {
                    meteors.splice(i, 1);
                }
            }

            // Renderizar Ondas Expansivas (Shockwaves)
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update();
                shockwaves[i].draw();
                if (shockwaves[i].alpha <= 0) {
                    shockwaves.splice(i, 1);
                }
            }

            // Renderizar Partículas (Fuegos artificiales, chispas, polvo)
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Continuar Loop
            requestAnimationFrame(animate);
        }

        /* ==========================================================================
           8. INICIALIZACIÓN
           ========================================================================== */
        window.onload = () => {
            initStars();
            renderHelloWorld();
            animate();
            
            // Explosión inicial de bienvenida
            setTimeout(() => {
                createFireworks(width / 2, height / 2, 50);
                createShockwave(width / 2, height / 2);
            }, 300);
        };
    </script>
</body>
</html>
