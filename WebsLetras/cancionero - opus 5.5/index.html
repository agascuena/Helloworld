<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lírica — Archivo Editorial de Canciones</title>
  <meta name="description" content="Explora y lee letras de canciones organizadas por estilo musical en una experiencia editorial moderna y elegante." />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Editorial typography & refined micro-interactions */
    .font-serif-display {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    }

    .font-sans-ui {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    /* Subtle paper-like grain overlay for tactile surface depth */
    .surface-grain {
      background-image: radial-gradient(color-mix(in srgb, var(--foreground) 5%, transparent) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Smooth view entrance animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .view-enter {
      animation: fadeSlideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Editorial card interaction */
    .genre-card {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.24s ease,
                  box-shadow 0.28s ease;
    }

    .genre-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--foreground) 28%, var(--border));
      box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--foreground) 14%, transparent);
    }

    .genre-card:hover .card-arrow {
      transform: translateX(4px);
    }

    .genre-card:hover .artwork-svg {
      transform: scale(1.04);
    }

    .artwork-svg {
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card-arrow {
      transition: transform 0.22s ease;
    }

    /* Track row interaction */
    .track-row {
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .track-row:hover {
      background-color: color-mix(in srgb, var(--foreground) 4%, var(--card));
      border-color: color-mix(in srgb, var(--foreground) 22%, var(--border));
    }

    /* ===== Atmospheric background with personality ===== */
    @property --bg-a { syntax: '<color>'; inherits: true; initial-value: #e9a23b; }
    @property --bg-b { syntax: '<color>'; inherits: true; initial-value: #c2562f; }
    @property --bg-c { syntax: '<color>'; inherits: true; initial-value: #3f8f6b; }

    body {
      --bg-a: #e9a23b; --bg-b: #d1495b; --bg-c: #1f8fa8;
      transition: --bg-a 0.9s ease, --bg-b 0.9s ease, --bg-c 0.9s ease;
    }
    body[data-theme="indie-folk"]       { --bg-a: #e9a23b; --bg-b: #c2562f; --bg-c: #5f8a4d; }
    body[data-theme="jazz-soul"]        { --bg-a: #2a62d6; --bg-b: #d9a441; --bg-c: #0f8b8d; }
    body[data-theme="rock-alternativo"] { --bg-a: #e5383b; --bg-b: #ff8a00; --bg-c: #274c77; }
    body[data-theme="bolero-bossa"]     { --bg-a: #ff6f91; --bg-b: #ffb347; --bg-c: #00a6a6; }
    body[data-theme="electronica-synth"]{ --bg-a: #00d4ff; --bg-b: #ff2e93; --bg-c: #2f5bea; }
    body[data-theme="afro-fusion"]      { --bg-a: #f59e0b; --bg-b: #dc2626; --bg-c: #059669; }

    #bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(55% 45% at 12% 8%,  color-mix(in srgb, var(--bg-a) 42%, transparent), transparent 70%),
        radial-gradient(50% 50% at 92% 22%, color-mix(in srgb, var(--bg-b) 36%, transparent), transparent 70%),
        radial-gradient(60% 55% at 55% 105%, color-mix(in srgb, var(--bg-c) 38%, transparent), transparent 70%);
    }
    #bg-layer::before {
      content: ""; position: absolute; inset: -20%;
      background:
        radial-gradient(30% 30% at 30% 40%, color-mix(in srgb, var(--bg-b) 22%, transparent), transparent 70%),
        radial-gradient(28% 28% at 75% 70%, color-mix(in srgb, var(--bg-a) 22%, transparent), transparent 70%);
      animation: bgDrift 26s ease-in-out infinite alternate;
    }
    #bg-layer::after {
      content: ""; position: absolute; inset: 0; opacity: 0.5; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    @keyframes bgDrift {
      from { transform: translate3d(-4%, -3%, 0) scale(1); }
      to   { transform: translate3d(5%, 4%, 0) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) { #bg-layer::before { animation: none; } }

    /* Glass surfaces so the colour glows through the cards */
    main [class*="bg-[var(--card)]"] {
      background-color: color-mix(in srgb, var(--card) 68%, transparent) !important;
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
    }

    /* Suno prompt block */
    .suno-prompt {
      background: color-mix(in srgb, var(--bg-a) 10%, var(--background));
      border: 1px dashed color-mix(in srgb, var(--foreground) 28%, transparent);
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 28%, transparent);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--muted-foreground) 48%, transparent);
    }

    /* Focus ring accessible */
    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Lyrics reading prose */
    .lyric-line {
      transition: opacity 0.2s ease;
    }

    .chorus-block {
      border-left: 2px solid color-mix(in srgb, var(--foreground) 28%, transparent);
      padding-left: 1.25rem;
    }

    /* Toast notification */
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 12px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .toast-visible {
      animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] font-sans-ui antialiased min-h-screen flex flex-col selection:bg-[var(--primary)] selection:text-[var(--primary-foreground)]">

  <div id="bg-layer" aria-hidden="true"></div>

          <span class="text-xs text-[var(--muted-foreground)] leading-none mt-1 hidden sm:inline">Archivo Musical</span>

      <!-- Search & Favorites Controls -->
      <div class="flex items-center gap-2.5 flex-1 justify-end max-w-md">
        <div class="relative flex-1 max-w-xs">
          <svg class="w-4 h-4 text-[var(--muted-foreground)] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <button

            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
          <span class="hidden sm:inline">Guardadas</span>
          <span id="nav-fav-count" class="tabular-nums text-[var(--muted-foreground)]">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Mount -->
  <main id="app-root" class="relative z-10 flex-1 w-full max-w-5xl mx-auto px-5 sm:px-8 py-8 sm:py-12">
    <!-- Dynamic views render here -->
  </main>

  <!-- Minimal Editorial Footer -->
  <footer class="relative z-10 border-t border-[var(--border)] mt-auto">
    <div class="max-w-5xl mx-auto px-5 sm:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-[var(--muted-foreground)]">
      <p class="font-serif-display text-sm text-[var(--foreground)]">Lírica · Selección de 6 estilos y 15 letras originales</p>
      <p>Diseñado para una lectura serena y atemporal</p>
    </div>
  </footer>

  <!-- Subtle Floating Toast -->
  <div
    id="toast-banner"
    role="status"
    aria-live="polite"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-full bg-[var(--foreground)] text-[var(--background)] text-xs font-medium shadow-lg"
  ></div>

          ['Instrumentación', 'Bajo log-drum resonante y melódico, cama continua de shakers, congas, acordes de Rhodes jazzísticos y silbato puntual'],
          ['Voz', 'Voz rítmica con onomatopeyas percusivas ("kú-kú-rá", "chiki-chá"), gritos de animación y coros repetitivos en trance'],
          ['Ritmo y estructura', '113 BPM, groove continuo de club afro. Intro onomatopéyica → verso → chant hipnótico → puente con entrada de log drum → clímax coral'],
          ['Producción', 'Subgraves profundos y definidos en el log drum, shakers envolventes y pegada de club moderna']
        ],
        exclude: 'acoustic country guitar, orchestral ballad, slow tempo, rock power chords'
      },
      'rio-de-oro': {
        style: 'Uplifting Afro-fusion world pop, wooden balafon and marimba melodies, groovy Afrobeat bass and live kit with afrobeat horn section, C major, 108 BPM, warm male and female vocal duet in Spanish, joyful call-and-response chants (yebo, eh-le-le), layered vocal harmonies, radiant celebratory production',
        details: [
          ['Género', 'Afro-Fusion / Afrobeat luminoso con balafón y vientos'],
          ['Ambiente', 'Celebración vital, río al sol, renovación y alegría colectiva'],
          ['Instrumentación', 'Balafón y marimba de madera, sección de vientos afrobeat (saxo y trompeta), guitarra rítmica funk-afro, batería viva y percusión'],
          ['Voz', 'Dúo masculino y femenino en constante diálogo con el coro ("— ¡yebo, yebo!", "— ¡eh-le-lé!") y repeticiones rítmicas de final de verso'],
          ['Ritmo y estructura', '108 BPM, pulso alegre y expansivo. Coro de apertura → verso → estribillo dialogado → puente de voces superpuestas → coda coral'],
          ['Producción', 'Sonido orgánico, rico en armónicos de madera y metal, mezcla amplia y festiva']
        ],
        exclude: 'sad slow piano ballad, industrial noise, heavy distortion, monotone vocals'
      }
    };

    const STORAGE_FAV_KEY = 'lirica_favorites_v1';

    const state = {
      view: 'home', // 'home' | 'genre' | 'song' | 'favorites' | 'search'
      genreId: null,
      songId: null,
      searchQuery: '',
      fontSizeIndex: 1, // 0: sm, 1: base, 2: lg, 3: xl
      focusMode: false,
      autoScroll: false,
      autoScrollTimer: null,
      favorites: loadFavorites()
    };

    const FONT_SIZES = [
      { label: 'Compacto', sizeClass: 'text-base leading-relaxed' },
      { label: 'Editorial', sizeClass: 'text-lg leading-loose' },
      { label: 'Amplio', sizeClass: 'text-xl leading-loose' },
      { label: 'Escenario', sizeClass: 'text-2xl leading-relaxed' }
    ];

    function loadFavorites() {
      try {
        const raw = localStorage.getItem(STORAGE_FAV_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? new Set(parsed) : new Set();
      } catch {
        return new Set();
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem(STORAGE_FAV_KEY, JSON.stringify([...state.favorites]));
      } catch {
        // Ignore storage restrictions
      }
    }

    // =========================================================================
    // 3. HELPERS
    // =========================================================================
    function getGenre(genreId) {
      return CATALOG.find(g => g.id === genreId) || null;
    }

    function getSongWithGenre(songId) {
      for (const genre of CATALOG) {
        const song = genre.songs.find(s => s.id === songId);
        if (song) return { genre, song };
      }
      return null;
    }

    function getAllSongs() {
      return CATALOG.flatMap(genre => genre.songs.map(song => ({ genre, song })));
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stopAutoScroll() {
      if (state.autoScrollTimer) {
        clearInterval(state.autoScrollTimer);
        state.autoScrollTimer = null;
      }
      state.autoScroll = false;
    }

    function toggleAutoScroll() {
      if (state.autoScroll) {
        stopAutoScroll();
        showToast('Desplazamiento automático pausado');
      } else {
        state.autoScroll = true;
        showToast('Desplazamiento suave activado');
        state.autoScrollTimer = setInterval(() => {
          const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
          if (atBottom) {
            stopAutoScroll();
            updateAutoScrollButton();
            showToast('Fin de la letra');
            return;
          }
          window.scrollBy({ top: 1, behavior: 'auto' });
        }, 42);
      }
      updateAutoScrollButton();
    }

    function updateAutoScrollButton() {
      const btn = document.getElementById('song-autoscroll-btn');
      if (!btn) return;
      if (state.autoScroll) {
        btn.setAttribute('aria-pressed', 'true');
        btn.classList.add('bg-[var(--primary)]', 'text-[var(--primary-foreground)]', 'border-transparent');
        btn.classList.remove('bg-[var(--card)]', 'text-[var(--foreground)]', 'border-[var(--border)]');
        btn.innerHTML = `
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
          <span>Pausar</span>
        `;
      } else {
        btn.setAttribute('aria-pressed', 'false');
        btn.classList.remove('bg-[var(--primary)]', 'text-[var(--primary-foreground)]', 'border-transparent');
        btn.classList.add('bg-[var(--card)]', 'text-[var(--foreground)]', 'border-[var(--border)]');
        btn.innerHTML = `
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
          <span>Auto-lectura</span>
        `;
      }
    }

    let toastTimeout = null;
    function showToast(message) {
      const el = document.getElementById('toast-banner');
      if (!el) return;
      el.textContent = message;
      el.classList.remove('hidden', 'toast-visible');
      void el.offsetWidth;
      el.classList.add('toast-visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        el.classList.add('hidden');
      }, 2400);
    }

    function updateHeaderFavorites() {
      const countEl = document.getElementById('nav-fav-count');
      const iconEl = document.getElementById('nav-fav-icon');
      const btnEl = document.getElementById('nav-favorites-btn');
      if (!countEl || !iconEl || !btnEl) return;

      countEl.textContent = String(state.favorites.size);
      if (state.view === 'favorites') {
        btnEl.classList.add('border-[var(--foreground)]');
        iconEl.setAttribute('fill', 'currentColor');
      } else {
        btnEl.classList.remove('border-[var(--foreground)]');
        iconEl.setAttribute('fill', state.favorites.size > 0 ? 'currentColor' : 'none');
      }
    }

    function formatLyricsForCopy(genre, song) {
      const header = `${song.title} — ${song.artist}\n${genre.name} · ${song.album} (${song.year})\n\n`;
      const body = song.sections
        .map(sec => `[${sec.label}]\n${sec.lines.join('\n')}`)
        .join('\n\n');
      return header + body;
    }

    // =========================================================================
    // 4. NAVIGATION
    // =========================================================================
    function navigate(view, params = {}) {
      stopAutoScroll();
      state.view = view;
      state.genreId = params.genreId ?? state.genreId;
      state.songId = params.songId ?? null;

      if (view !== 'search') {
        state.searchQuery = '';
        const input = document.getElementById('global-search-input');
        if (input && input.value) input.value = '';
      }

      if (view !== 'song') {
        state.focusMode = false;
      }

      updateHeaderFavorites();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 5. VIEW RENDERERS
    // =========================================================================
    function renderHomeView() {
      document.title = 'Lírica — Archivo Editorial de Canciones';

      const cardsHtml = CATALOG.map((genre) => {

            <p class="text-sm sm:text-base text-[var(--muted-foreground)] leading-relaxed max-w-xl">

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
            ${cardsHtml}
          </div>
        </section>

    }

        return renderHomeView();

      const { genre, song } = found;
      document.title = `${song.title} — ${song.artist} · Lírica`;

      const isFav = state.favorites.has(song.id);
      const fontSpec = FONT_SIZES[state.fontSizeIndex];
      const currentIdx = genre.songs.findIndex(s => s.id === song.id);
      const nextSong = genre.songs.length > 1
        ? genre.songs[(currentIdx + 1) % genre.songs.length]
        : null;

      const lyricsHtml = song.sections.map(section => {
        const isChorus = section.type === 'chorus';
        const linesHtml = section.lines

                  ${escapeHtml(song.artist)}

                <div class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs text-[var(--muted-foreground)]">

            </div>

            <!-- Minimalist Reading Toolbar -->
            <div class="pt-5 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2">
                <!-- Font Size Control -->
                <div class="inline-flex items-center rounded-full border border-[var(--border)] bg-[var(--background)] p-0.5">
                  <button
                    id="font-decrease-btn"
                    type="button"
                    data-action="font-decrease"
                    aria-label="Reducir tamaño de letra"
                    ${state.fontSizeIndex === 0 ? 'disabled' : ''}
                    class="h-7 px-2.5 rounded-full text-xs font-medium hover:bg-[var(--secondary)] disabled:opacity-35 transition-colors cursor-pointer"
                  >
                    A−
                  </button>
                  <span class="px-2 text-xs text-[var(--muted-foreground)] select-none">
                    ${fontSpec.label}
                  </span>
                  <button
                    id="font-increase-btn"
                    type="button"
                    data-action="font-increase"
                    aria-label="Aumentar tamaño de letra"
                    ${state.fontSizeIndex === FONT_SIZES.length - 1 ? 'disabled' : ''}
                    class="h-7 px-2.5 rounded-full text-xs font-medium hover:bg-[var(--secondary)] disabled:opacity-35 transition-colors cursor-pointer"
                  >
                    A+
                  </button>
                </div>

                <!-- Auto-scroll Toggle -->
                <button
                  id="song-autoscroll-btn"
                  type="button"
                  data-action="toggle-autoscroll"
                  aria-pressed="${state.autoScroll}"
                  class="h-8 px-3.5 rounded-full border border-[var(--border)] bg-[var(--card)] text-xs font-medium inline-flex items-center gap-1.5 hover:bg-[var(--secondary)] transition-colors cursor-pointer"
                >
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <polygon points="6 4 20 12 6 20 6 4"></polygon>
                  </svg>
                  <span>Auto-lectura</span>
                </button>

                <!-- Focus Mode Toggle -->
                <button
                  id="song-focus-btn"
                  type="button"
                  data-action="toggle-focus"
                  aria-pressed="${state.focusMode}"
                  class="h-8 px-3.5 rounded-full border text-xs font-medium inline-flex items-center gap-1.5 transition-colors cursor-pointer ${
                    state.focusMode
                      ? 'bg-[var(--foreground)] text-[var(--background)] border-transparent'
                      : 'bg-[var(--card)] text-[var(--foreground)] border-[var(--border)] hover:bg-[var(--secondary)]'
                  }"
                >
                  <span>Modo enfoque</span>
                </button>
              </div>

              <div class="flex items-center gap-2">
                <!-- Copy Lyrics -->
                <button
                  id="song-copy-btn"
                  type="button"
                  data-action="copy-lyrics"
                  data-song-id="${song.id}"
                  class="h-8 px-3.5 rounded-full border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium inline-flex items-center gap-1.5 transition-colors cursor-pointer"
                >
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                  </svg>
                  <span>Copiar</span>
                </button>

                <!-- Favorite Toggle -->
                <button
                  id="song-fav-btn"
                  type="button"
                  data-action="toggle-favorite"
                  data-song-id="${song.id}"
                  aria-pressed="${isFav}"
                  class="h-8 px-3.5 rounded-full border text-xs font-medium inline-flex items-center gap-1.5 transition-colors cursor-pointer ${
                    isFav
                      ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent'
                      : 'bg-[var(--card)] text-[var(--foreground)] border-[var(--border)] hover:bg-[var(--secondary)]'
                  }"
                >
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                  </svg>
                  <span>${isFav ? 'Guardada' : 'Guardar'}</span>
                </button>
              </div>
            </div>
          </header>

          <!-- Lyrics Body Sheet -->
          <section
            aria-label="Letra de la canción"
            class="rounded-2xl bg-[var(--card)] border border-[var(--border)] px-6 py-8 sm:px-12 sm:py-12"
          >
            <div class="space-y-9 max-w-xl">
              ${lyricsHtml}
            </div>
          </section>

          ${(() => {
            const s = SUNO[song.id];
            if (!s) return '';
            const rows = s.details.map(([k, v]) => `
              <div class="grid grid-cols-1 sm:grid-cols-[150px_1fr] gap-x-4 gap-y-1 py-3 border-t border-[var(--border)]">
                <dt class="text-xs uppercase tracking-[0.14em] text-[var(--muted-foreground)] font-medium pt-0.5">${escapeHtml(k)}</dt>
                <dd class="text-sm text-[var(--foreground)] leading-relaxed">${escapeHtml(v)}</dd>
              </div>`).join('');
            return `
            <section aria-label="Descripción musical para Suno" class="rounded-2xl bg-[var(--card)] border border-[var(--border)] p-6 sm:p-8 space-y-5">
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div>
                  <p class="text-xs uppercase tracking-[0.16em] text-[var(--muted-foreground)]">Producción musical</p>
                  <h2 class="mt-1 font-serif-display text-2xl tracking-tight text-[var(--foreground)]">Descripción para Suno</h2>
                  <p class="mt-1 text-sm text-[var(--muted-foreground)]">Pega el prompt en el campo <em>Style of Music</em> y la letra en <em>Lyrics</em>.</p>
                </div>
                <div class="flex items-center gap-2">
                  <button id="copy-suno-btn" type="button" data-action="copy-suno" data-song-id="${song.id}" class="h-8 px-3.5 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium hover:opacity-90 transition-opacity cursor-pointer">Copiar prompt</button>
                  <button id="copy-lyrics-suno-btn" type="button" data-action="copy-lyrics" data-song-id="${song.id}" class="h-8 px-3.5 rounded-full border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer transition-colors">Copiar letra</button>
                </div>
              </div>

              <div class="suno-prompt rounded-xl p-4 sm:p-5">
                <p class="text-xs uppercase tracking-[0.16em] text-[var(--muted-foreground)] mb-2">Style of Music · prompt</p>
                <p class="font-mono text-[13px] leading-relaxed text-[var(--foreground)] select-all">${escapeHtml(s.style)}</p>
              </div>

              <dl>${rows}</dl>

              <div class="suno-prompt rounded-xl p-4">
                <p class="text-xs uppercase tracking-[0.16em] text-[var(--muted-foreground)] mb-1.5">Exclude styles</p>
                <p class="font-mono text-[13px] text-[var(--foreground)] select-all">${escapeHtml(s.exclude)}</p>
              </div>
            </section>`;
          })()}

          ${nextSong ? `
            <aside class="rounded-2xl bg-[var(--card)] border border-[var(--border)] p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="text-xs uppercase tracking-[0.16em] text-[var(--muted-foreground)]">
                  También en ${escapeHtml(genre.shortName)}
                </p>
                <p class="mt-1 font-serif-display text-xl text-[var(--foreground)]">
                  ${escapeHtml(nextSong.title)}
                </p>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                  ${escapeHtml(nextSong.artist)} · ${nextSong.duration}
                </p>
              </div>
              <button
                id="next-song-btn"
                type="button"
                data-action="open-song"
                data-genre-id="${genre.id}"
                data-song-id="${nextSong.id}"
                class="h-9 px-4 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium inline-flex items-center gap-1.5 hover:opacity-90 transition-opacity cursor-pointer self-start sm:self-center shrink-0"
              >
                <span>Leer siguiente letra</span>
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </button>
            </aside>
          ` : ''}
        </article>
      `;
    }

    function renderFavoritesView() {
      document.title = 'Canciones Guardadas — Lírica';
      const saved = getAllSongs().filter(({ song }) => state.favorites.has(song.id));

      const listHtml = saved.length > 0
        ? saved.map(({ genre, song }) => `
            <article class="track-row rounded-2xl bg-[var(--card)] border border-[var(--border)] p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <button
                type="button"
                data-action="open-song"
                data-genre-id="${genre.id}"
                data-song-id="${song.id}"
                class="text-left flex-1 cursor-pointer group"
              >
                <p class="text-xs text-[var(--muted-foreground)]">${escapeHtml(genre.name)}</p>
                <h2 class="mt-1 font-serif-display text-xl sm:text-2xl tracking-tight text-[var(--foreground)] group-hover:underline underline-offset-4 decoration-1">
                  ${escapeHtml(song.title)}
                </h2>
                <p class="mt-1 text-xs text-[var(--muted-foreground)]">
                  ${escapeHtml(song.artist)} · ${escapeHtml(song.album)} (${song.year})
                </p>
              </button>

              <div class="flex items-center gap-2">
                <button
                  type="button"
                  data-action="toggle-favorite"
                  data-song-id="${song.id}"
                  class="h-8 px-3 rounded-full border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors cursor-pointer"
                >
                  Quitar
                </button>
                <button
                  type="button"
                  data-action="open-song"
                  data-genre-id="${genre.id}"
                  data-song-id="${song.id}"
                  class="h-8 px-4 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium cursor-pointer hover:opacity-90 transition-opacity"
                >
                  Leer letra
                </button>
              </div>
            </article>
          `).join('')
        : `
          <div class="rounded-2xl bg-[var(--card)] border border-[var(--border)] p-10 text-center space-y-3">
            <p class="font-serif-display text-xl text-[var(--foreground)]">Aún no has guardado ninguna canción</p>
            <p class="text-sm text-[var(--muted-foreground)] max-w-md mx-auto">
              Explora los 5 estilos musicales y pulsa el icono de corazón en tus letras preferidas para tenerlas siempre a mano.
            </p>
            <div class="pt-2">
              <button
                type="button"
                data-action="go-home"
                class="h-9 px-5 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium cursor-pointer hover:opacity-90 transition-opacity"
              >
                Explorar estilos musicales
              </button>
            </div>
          </div>
        `;

      return `
        <section class="view-enter space-y-8">
          <div class="space-y-3">
            <button
              type="button"
              data-action="go-home"
              class="inline-flex items-center gap-2 text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors cursor-pointer"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
              <span>Volver a estilos</span>
            </button>
            <h1 class="font-serif-display text-3xl sm:text-4xl tracking-tight font-normal text-[var(--foreground)]">
              Canciones guardadas
            </h1>
            <p class="text-sm text-[var(--muted-foreground)]">
              ${saved.length === 1 ? '1 letra en tu biblioteca personal.' : `${saved.length} letras en tu biblioteca personal.`}
            </p>
          </div>

          <div class="space-y-4">
            ${listHtml}
          </div>
        </section>
      `;
    }

    function renderSearchView() {
      const q = state.searchQuery.trim().toLowerCase();
      document.title = `Buscar "${state.searchQuery}" — Lírica`;

      const results = getAllSongs().filter(({ genre, song }) => {
        const lyricsText = song.sections.flatMap(s => s.lines).join(' ').toLowerCase();
        return (
          song.title.toLowerCase().includes(q) ||
          song.artist.toLowerCase().includes(q) ||
          song.album.toLowerCase().includes(q) ||
          genre.name.toLowerCase().includes(q) ||
          lyricsText.includes(q)
        );
      });

      const listHtml = results.length > 0
        ? results.map(({ genre, song }) => {
            const matchingLine = song.sections
              .flatMap(s => s.lines)
              .find(line => line.toLowerCase().includes(q));

            return `
              <article class="track-row rounded-2xl bg-[var(--card)] border border-[var(--border)] p-5 sm:p-6">
                <button
                  type="button"
                  data-action="open-song"
                  data-genre-id="${genre.id}"
                  data-song-id="${song.id}"
                  class="w-full text-left cursor-pointer group flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                >
                  <div class="space-y-1.5">
                    <p class="text-xs text-[var(--muted-foreground)]">${escapeHtml(genre.name)}</p>
                    <h2 class="font-serif-display text-xl sm:text-2xl tracking-tight text-[var(--foreground)] group-hover:underline underline-offset-4 decoration-1">
                      ${escapeHtml(song.title)}
                    </h2>
                    <p class="text-xs text-[var(--muted-foreground)]">
                      ${escapeHtml(song.artist)} · ${escapeHtml(song.album)} · ${song.duration}
                    </p>
                    ${matchingLine ? `
                      <p class="pt-1 font-serif-display italic text-sm text-[var(--muted-foreground)]">
                        “…${escapeHtml(matchingLine)}…”
                      </p>
                    ` : ''}
                  </div>
                  <span class="h-8 px-4 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium inline-flex items-center gap-1.5 self-start sm:self-center shrink-0">
                    Leer letra
                  </span>
                </button>
              </article>
            `;
          }).join('')
        : `
          <div class="rounded-2xl bg-[var(--card)] border border-[var(--border)] p-10 text-center space-y-3">
            <p class="font-serif-display text-xl text-[var(--foreground)]">Sin coincidencias para “${escapeHtml(state.searchQuery)}”</p>
            <p class="text-sm text-[var(--muted-foreground)]">
              Prueba con el nombre de un género, un artista o una palabra dentro de las letras.
            </p>
          </div>
        `;

      return `
        <section class="view-enter space-y-8">
          <div class="space-y-2">
            <button
              type="button"
              data-action="go-home"
              class="inline-flex items-center gap-2 text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors cursor-pointer"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
              <span>Limpiar búsqueda</span>
            </button>
            <h1 class="font-serif-display text-2xl sm:text-3xl tracking-tight font-normal text-[var(--foreground)]">
              Resultados para “${escapeHtml(state.searchQuery)}”
            </h1>
            <p class="text-xs text-[var(--muted-foreground)]">
              ${results.length === 1 ? '1 canción encontrada' : `${results.length} canciones encontradas`}
            </p>
          </div>

          <div class="space-y-4">
            ${listHtml}
          </div>
        </section>
      `;
    }

    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      // Colour atmosphere follows the genre being viewed
      let themeId = '';
      if (state.view === 'genre') themeId = state.genreId || '';
      else if (state.view === 'song') themeId = (getSongWithGenre(state.songId)?.genre.id) || '';
      document.body.dataset.theme = themeId;

      if (state.view === 'home') {
        root.innerHTML = renderHomeView();
      } else if (state.view === 'genre') {
        root.innerHTML = renderGenreView();
      } else if (state.view === 'song') {
        root.innerHTML = renderSongView();
        updateAutoScrollButton();
      } else if (state.view === 'favorites') {
        root.innerHTML = renderFavoritesView();
      } else if (state.view === 'search') {
        root.innerHTML = renderSearchView();
      }
    }

    // =========================================================================
    // 6. EVENT DELEGATION & INTERACTIONS
    // =========================================================================
    document.getElementById('nav-brand-btn').addEventListener('click', () => {
      navigate('home');
    });

    document.getElementById('nav-favorites-btn').addEventListener('click', () => {
      navigate('favorites');
    });

    document.getElementById('global-search-input').addEventListener('input', (event) => {
      const val = event.target.value;
      state.searchQuery = val;
      if (val.trim().length > 0) {
        stopAutoScroll();
        state.view = 'search';
        updateHeaderFavorites();
        render();
      } else {
        navigate('home');
      }
    });

    document.getElementById('app-root').addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;

      if (action === 'go-home') {
        navigate('home');
      } else if (action === 'open-genre') {
        navigate('genre', { genreId: target.dataset.genreId });
      } else if (action === 'open-song') {
        navigate('song', {
          genreId: target.dataset.genreId,
          songId: target.dataset.songId
        });
      } else if (action === 'toggle-favorite') {
        const songId = target.dataset.songId;
        if (!songId) return;
        if (state.favorites.has(songId)) {
          state.favorites.delete(songId);
          showToast('Quitada de guardadas');
        } else {
          state.favorites.add(songId);
          showToast('Canción guardada');
        }
        saveFavorites();
        updateHeaderFavorites();
        render();
      } else if (action === 'font-increase') {
        if (state.fontSizeIndex < FONT_SIZES.length - 1) {
          state.fontSizeIndex += 1;
          render();
        }
      } else if (action === 'font-decrease') {
        if (state.fontSizeIndex > 0) {
          state.fontSizeIndex -= 1;
          render();
        }
      } else if (action === 'toggle-focus') {
        state.focusMode = !state.focusMode;
        render();
      } else if (action === 'toggle-autoscroll') {
        toggleAutoScroll();
      } else if (action === 'copy-suno') {
        const s = SUNO[target.dataset.songId];
        if (!s) return;
        const text = s.style + '\n\nExclude: ' + s.exclude;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('Prompt de Suno copiado');
      } else if (action === 'copy-lyrics') {
        const found = getSongWithGenre(target.dataset.songId);
        if (!found) return;
        const formatted = formatLyricsForCopy(found.genre, found.song);
        try {
          await navigator.clipboard.writeText(formatted);
          showToast('Letra copiada al portapapeles');
        } catch {
          // Fallback copy
          const ta = document.createElement('textarea');
          ta.value = formatted;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Letra copiada al portapapeles');
        }
      }
    });

    // Keyboard shortcut: Escape to navigate up one level
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (state.view === 'song' && state.genreId) {
          navigate('genre', { genreId: state.genreId });
        } else if (state.view !== 'home') {
          navigate('home');
        }
      }
    });

    // Initial render
    updateHeaderFavorites();
    render();
  </script>
</body>
</html>
